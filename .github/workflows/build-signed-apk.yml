name: "Build signed release APK"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace -DskipFormatKtlint

      - name: Sign APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass newpipe \
            -keypass newpipe \
            -alias newpipe \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NewPipe Build"

          UNSIGNED_APK="$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -n 1)"
          VERSION_NAME="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          OUTPUT_APK="NewPipe_v${VERSION_NAME}_release.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:newpipe \
            --key-pass pass:newpipe \
            --out "$OUTPUT_APK" \
            "$UNSIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUTPUT_APK"
          echo "APK: $OUTPUT_APK"

      - name: Upload APK and signing key
        uses: actions/upload-artifact@v7
        with:
          name: newpipe-release
          path: |
            NewPipe_v*_release.apk
            release.keystore
          if-no-files-found: error
